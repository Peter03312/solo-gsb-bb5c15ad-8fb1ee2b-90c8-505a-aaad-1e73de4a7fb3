services:
  liftover-web:
    build: .
    image: liftover-web:1.0.0
    container_name: liftover-web
    # 宿主机端口可用环境变量 LIFTOVER_PORT 覆盖，默认 8080
    ports:
      - "${LIFTOVER_PORT:-8080}:8080"
    environment:
      # 单文件上传上限（MB）
      LIFTOVER_MAX_UPLOAD_MB: "${LIFTOVER_MAX_UPLOAD_MB:-50}"
      # 转换结果在内存中的保留时长（秒）
      LIFTOVER_JOB_TTL_SECONDS: "${LIFTOVER_JOB_TTL_SECONDS:-3600}"
      # 内存中同时保留的结果任务上限
      LIFTOVER_MAX_JOBS: "${LIFTOVER_MAX_JOBS:-100}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
